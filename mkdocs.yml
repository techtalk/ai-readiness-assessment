site_name: TechTalk AI Readiness Assessment
site_description: >-
  A self-contained Claude Code & GitHub Copilot plugin that assesses a
  team's AI readiness against the Agentic Experience 5-Level Habitat
  Maturity Model and the Sovereign Engineer framework.
site_url: https://techtalk.github.io/ai-readiness-assessment/
repo_url: https://github.com/techtalk/ai-readiness-assessment
repo_name: techtalk/ai-readiness-assessment
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  font: false
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

copyright: "&copy; TechTalk GmbH &middot; Vienna, Austria"

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/techtalk/ai-readiness-assessment
    - icon: fontawesome/solid/globe
      link: https://techtalk.at
      name: TechTalk
    - icon: material/book-open-variant
      link: https://leanpub.com/thesovereignengineer/c/ai-readiness
      name: The Sovereign Engineer

nav:
  - Home: index.md
  - Example assessment: examples.md
  - Tutorials:
      - tutorials/index.md
      - Your first assessment: tutorials/your-first-assessment.md
  - How-to guides:
      - how-to/index.md
      - Install in GitHub Copilot CLI: how-to/install-github-copilot.md
      - Install in Claude Code: how-to/install-claude-code.md
      - Run an assessment: how-to/run-an-assessment.md
      - Read the Habitat/Workflow Gap: how-to/read-the-habitat-workflow-gap.md
      - Run the precise survey: how-to/run-the-precise-survey.md
      - Render the HTML report: how-to/render-the-html-report.md
      - Update or remove the plugin: how-to/update-or-remove.md
  - Reference:
      - reference/index.md
      - Habitat Maturity Model (14 dimensions): reference/habitat-maturity-model.md
      - Cognitive ladder & disciplines: reference/cognitive-ladder.md
      - The Habitat/Workflow Gap: reference/habitat-workflow-gap.md
      - Assessment output structure: reference/assessment-output.md
      - Command & skill: reference/command-and-skill.md
  - Explanation:
      - explanation/index.md
      - Two reads, one habitat: explanation/two-reads.md
      - Coherence, not level: explanation/coherence-not-level.md
      - Why it is self-contained: explanation/self-contained.md
      - The Sovereign Engineer: explanation/the-sovereign-engineer.md
  # Multi-repo is grouped as one section rather than folded into the
  # Diataxis lists above: it is an opt-in capability, and single-repo
  # readers should not have to step over it to find anything.
  - Multi-repo:
      - Tutorials:
          - Roll up existing assessments: tutorials/roll-up-existing-assessments.md
          - Assess a team across repositories: tutorials/assess-a-team-across-repositories.md
      - How-to guides:
          - Write a scope manifest: how-to/write-a-scope-manifest.md
          - Assess repos with a shared harness: how-to/assess-repos-with-a-shared-harness.md
          - Assess a monorepo with several habitats: how-to/assess-a-monorepo-with-several-habitats.md
          - Assess with an org-level habitat: how-to/assess-with-an-org-level-habitat.md
          - Assess across a client boundary: how-to/assess-across-a-client-boundary.md
      - Reference:
          - Scope manifest schema: reference/scope-manifest.md
          - Assessment summary block: reference/assessment-summary-block.md
          - Portfolio report structure: reference/portfolio-report.md
          - Provenance and binding: reference/provenance-and-binding.md
          - Portfolio regimes: reference/portfolio-regimes.md
      - Explanation:
          - Why there is no portfolio score: explanation/why-no-portfolio-score.md
          - Distribution is not federation: explanation/distribution-is-not-federation.md
          - Subject, habitat, team: explanation/subject-habitat-team.md
          - Extract or bind: explanation/extract-or-bind.md
      - Examples:
          - Habitat-Thinking estate (real): examples/habitat-thinking-estate.md
          - Parent repo with submodules: examples/parent-repo-submodules.md
          - Separate harness, partially bound: examples/separate-harness-partially-bound.md
          - Fragmented estate: examples/fragmented-estate.md
